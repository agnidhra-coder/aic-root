[project]
name = "kpi-engine"
version = "0.1.0"
description = "Deterministic KPI anomaly detection and causal attribution engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "ruptures>=1.1.9",
    "scipy>=1.13",
    "networkx>=3.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The agent layer is optional on purpose: the deterministic engine must remain
# installable and runnable with no LLM dependency and no API key.
agent = [
    "langgraph>=0.2",
    "langchain-google-genai>=4.0.0",
    "python-dotenv>=1.2.3",
]
# Presentation only. The CLIs degrade to plain text without it -- `_common.py`
# imports rich lazily -- so this buys legibility, never capability.
cli = ["rich>=13.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpi_engine", "src/kpi_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises the full pipeline end to end (seconds, not milliseconds)"]
pythonpath = ["src"]

[tool.uv]
package = true
