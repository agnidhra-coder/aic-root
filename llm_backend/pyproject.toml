[project]
name = "kpi-engine"
version = "0.1.0"
description = "Deterministic KPI anomaly detection and causal attribution engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "ruptures>=1.1.9",
    "scipy>=1.13",
    "networkx>=3.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# httpx is what `fastapi.testclient` drives the app with; it is already present
# transitively, but a test dependency should be declared rather than inherited.
dev = ["pytest>=8.0", "httpx>=0.27"]
# The agent layer is optional on purpose: the deterministic engine must remain
# installable and runnable with no LLM dependency and no API key.
agent = [
    "langgraph>=0.2",
    "langchain-google-genai>=4.0.0",
    "python-dotenv>=1.2.3",
]
# Presentation only. The CLIs degrade to plain text without it -- `_common.py`
# imports rich lazily -- so this buys legibility, never capability.
cli = ["rich>=13.7"]
# Transport only -- `kpi_api` is a third view of a run and computes nothing, and
# the engine and the CLI are unaffected by its absence. SSE is fifteen lines of
# string formatting in `app.py` rather than a dependency, on the same reasoning
# as the `cli` extra: a dependency should buy capability.
#
# It does pull `agent` in, though, because unlike `cli` this is not a graceful
# degradation: the API serves the agent and `kpi_agent.graph` imports langgraph
# at module scope, so an `api` install without it cannot start at all. Declaring
# the dependency is what makes `uv sync --extra api` produce a working server --
# `uv sync` is exact and uninstalls whatever extra you did not name.
#
# `python-multipart` is FastAPI's form parser. It is a hard requirement, not an
# optional one: `POST /companies/{c}/sources/{sid}/data` takes an uploaded CSV,
# and without it FastAPI raises at import time rather than at request time.
api = [
    "kpi-engine[agent]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpi_engine", "src/kpi_agent", "src/kpi_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises the full pipeline end to end (seconds, not milliseconds)"]
pythonpath = ["src"]

[tool.uv]
package = true
