# The governed graph for a supply-chain tenant.
#
# Hand-authored, not discovered -- the direction of a business mechanism is domain
# knowledge, not something to infer from correlation. `forbidden_edges` records
# the reversals explicitly, so a discovery routine (or a model proposing a graph)
# has something to be checked against.
#
# `controllable` and `owner` are what turn a statistical driver into an actionable
# lever with decision rights: a finding about Units Ordered reaches Supply Chain,
# who can change it, while one about Supplier Fill Rate is context to escalate
# rather than a dial to turn.
#
# Every KPI node here appears in `configs/semantics/kpis.yaml`, and every measure
# node names a column that contract or the source spec declares. That
# correspondence is the point: a graph naming another domain's metrics licenses no
# explanation of this one's, and `test_every_template_dag_names_only_its_own_contracts_kpis`
# fails if the two drift apart.
graph_id: scm_core_v1

nodes:
  # --- KPIs (leaves; deterministic functions of their measures) ---
  - {name: Fill Rate, kind: kpi, description: Share of ordered units actually delivered.}
  - {name: Weighted Lead Time, kind: kpi, description: Unit-weighted days from order to receipt.}
  - {name: Stockout Rate, kind: kpi, description: Share of days a line was unavailable.}
  - {name: Days Of Supply, kind: kpi, description: Days of demand the on-hand position covers.}

  # --- Measures the KPIs are built from ---
  - {name: Units Received, kind: measure, column: Units Received,
     description: Units actually delivered in the period.}
  - {name: Units Ordered, kind: measure, column: Units Ordered,
     controllable: true, owner: Supply Chain,
     description: Units placed on order. The replenishment dial.}
  - {name: Lead Time Unit Days, kind: measure, column: Lead Time Unit Days,
     description: "Unit-days between order and receipt. Weighting, not a lever."}
  - {name: Stockout Days, kind: measure, column: Stockout Days,
     description: Days a line was unavailable to sell.}
  - {name: Days In Period, kind: measure, column: Days In Period,
     description: "Calendar days in the period. A denominator, never a driver."}
  - {name: On Hand Units, kind: measure, column: On Hand Units,
     description: Inventory position at the end of the period.}

  # --- Commercial terms and upstream conditions ---
  - {name: Purchase Price Per Unit, kind: measure, column: Purchase Price Per Unit,
     controllable: true, owner: Procurement,
     description: Negotiated unit cost. Restricted; withheld from personas without entitlement.}
  - {name: Inbound Freight Cost, kind: measure, column: Inbound Freight Cost,
     controllable: true, owner: Logistics,
     description: Cost of moving goods inbound. Restricted.}

edges:
  # Deterministic: these follow from the KPI formulas, not from an estimate.
  - {source: Units Received, target: Fill Rate, relation: deterministic}
  - {source: Units Ordered, target: Fill Rate, relation: deterministic}
  - {source: Lead Time Unit Days, target: Weighted Lead Time, relation: deterministic}
  - {source: Units Received, target: Weighted Lead Time, relation: deterministic}
  - {source: Stockout Days, target: Stockout Rate, relation: deterministic}
  - {source: Days In Period, target: Stockout Rate, relation: deterministic}
  - {source: On Hand Units, target: Days Of Supply, relation: deterministic}
  - {source: Units Received, target: Days Of Supply, relation: deterministic}

  # Causal: domain mechanisms.
  - {source: Units Ordered, target: Units Received, relation: causal,
     note: A supplier cannot deliver more than was ordered.}
  - {source: Lead Time Unit Days, target: Units Received, relation: causal,
     note: Shipments still in transit at period end are not received in it.}
  - {source: Units Received, target: On Hand Units, relation: causal,
     note: Receipts replenish the on-hand position.}
  - {source: Units Received, target: Stockout Days, relation: causal,
     note: "Units that were never delivered cannot be sold, so the line goes dark."}
  - {source: On Hand Units, target: Stockout Days, relation: causal,
     note: A position at zero is what a stockout day is.}
  - {source: Inbound Freight Cost, target: Lead Time Unit Days, relation: causal,
     note: Cheaper freight modes are slower ones; the trade-off runs through routing.}
  - {source: Purchase Price Per Unit, target: Units Ordered, relation: causal,
     note: Unit cost sets how much a fixed budget buys.}

forbidden_edges:
  # Semantically impossible directions. Rejected at load even if proposed.
  - [Fill Rate, Units Received]
  - [Fill Rate, Units Ordered]
  - [Weighted Lead Time, Lead Time Unit Days]
  - [Weighted Lead Time, Units Received]
  - [Stockout Rate, Stockout Days]
  - [Stockout Rate, Days In Period]
  - [Days Of Supply, On Hand Units]
  - [Days Of Supply, Units Received]
  - [Units Received, Units Ordered]
  - [Stockout Days, Units Received]
  - [Stockout Days, On Hand Units]
  - [On Hand Units, Units Received]
  - [Lead Time Unit Days, Inbound Freight Cost]
  - [Units Ordered, Purchase Price Per Unit]
  # Calendar length is fixed by the calendar; nothing in the business moves it.
  - [Stockout Rate, Days In Period]
  - [Units Received, Days In Period]
