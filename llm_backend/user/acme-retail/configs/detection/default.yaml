# Detector parameters.
#
# Thresholds are calibrated against the injected ground-truth scenario, not
# guessed: cli.evaluate reports precision and recall, so changing a number here
# has a measurable consequence rather than a vibe.
profile_id: default

decomposition:
  enabled: true
  period: 7                  # weekly cycle at daily grain
  robust: true
  min_periods_required: 3    # need 3 full cycles before STL output is trusted

baseline:
  model: ridge_lags
  lags: [1, 7, 14]
  rolling_windows: [7, 28]
  min_train_periods: 56      # two months before the first expectation is emitted

point:
  enabled: true
  # 3.5 rather than the conventional 2.5. At 2.5 a modified z-score flags roughly
  # 1-2% of periods by construction, which on 730 days of pure noise is ~10 false
  # events per series. The injected shock is a sustained regime change and is
  # caught by the change-point detectors; point detection is left to genuinely
  # isolated spikes, where a stricter bar costs nothing.
  z_threshold: 3.5
  mad_floor: 1.0e-9

changepoint:
  enabled: true
  method: both               # PELT and CUSUM fail differently; run both
  pelt_model: rbf
  pelt_penalty: 12.0
  min_segment: 14            # a break needs two weeks either side to be a regime, not a blip
  cusum_k: 0.6               # slack, in robust sigma units
  cusum_h: 6.0               # decision interval, in robust sigma units

multivariate:
  enabled: true
  alpha: 0.0005              # chi-square tail; strict because 730 periods x many slices
  shrinkage: 0.15            # covariance shrinkage, guards near-singular estimates
  min_train_periods: 90

windowing:
  merge_gap: 2               # flags within 2 *periods* belong to one event (grain-aware)
  min_window_len: 1
  # Residuals on ratio KPIs are heavy-tailed -- CAC at region grain runs to 10x its
  # median -- so a modified z-score flags far more than the nominal tail probability
  # implies. Raising the z-threshold to compensate would also suppress real events.
  # Requiring corroboration instead is stable. Both bars must be cleared: several
  # flags in the window AND two independent detector families agreeing. Measured on
  # the injected scenario, this keeps recall at 100% while removing the false
  # positives that come from one detector firing twice on the same noise.
  min_flags: 2
  min_detectors: 2
  require_material: true     # no business impact, no finding

confidence_threshold: 0.70   # below this the engine abstains rather than asserts
